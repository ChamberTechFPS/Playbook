name: Bug Report
description: Something broke after running Chamber Playbook
labels: [bug]
body:
  - type: input
    id: winver
    attributes:
      label: Windows version
      description: Run `winver` — e.g. 24H2 (26100.2314)
      placeholder: "25H2 (26200.xxxx)"
    validations:
      required: true
  - type: input
    id: pbversion
    attributes:
      label: Chamber Playbook version
      description: Shown in AME Wizard, and as chamberVersion in C:\ChamberTech\deployment-receipt.json
      placeholder: "v1.3.3"
    validations:
      required: true
  - type: dropdown
    id: installtype
    attributes:
      label: Install type
      options:
        - Fresh Windows install, run from AME Wizard (as recommended)
        - Injected into a Windows ISO (applied during setup)
        - Existing/upgraded install
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser chosen in AME Wizard
      options:
        - Google Chrome
        - Brave
        - None - kept Microsoft Edge
    validations:
      required: true
  - type: checkboxes
    id: options
    attributes:
      label: Options selected in AME Wizard
      options:
        - label: Remove Xbox apps and services
        - label: Turn off Game Bar overlay and recording
        - label: OLED burn-in protection
        - label: Turn off BitLocker / device encryption
        - label: Turn off VBS and Memory Integrity
        - label: Stop automatic Windows Updates
        - label: Turn off Smart App Control
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What broke, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Chamber verification report
      description: >
        Run C:\ChamberTech\PostInstall\START-HERE.bat as administrator, run verification,
        and attach the ChamberReport zip from your Desktop, or paste the
        summary here. Logs live in C:\ProgramData\ChamberPostInstall\logs.
