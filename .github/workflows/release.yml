name: Build and Release Playbook

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs before packaging so a config AME Wizard would reject - or would
      # silently leave out of its ISO injection picker - fails here rather than
      # on a user's machine. It also carries the ISO staging gates: cached
      # download sources and staging, <Software>-to-payload pairing, and the
      # winget / shutdown / powerShell stage rules. Those failures do not show up
      # at load time; they show up on a machine somebody has already booted.
      #
      # On a tag build it also asserts playbook.conf's <Version> matches the tag;
      # v1.2.5 shipped declaring 1.2.4 without this.
      - name: Validate playbook.conf and ISO injection config
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            python3 tools/validate_playbook_conf.py --expect-version "$GITHUB_REF_NAME"
          else
            python3 tools/validate_playbook_conf.py
          fi

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Regenerate verification manifest
        run: python3 tools/generate_verification_manifest.py

      - name: Fail if manifest is out of date in the repo
        run: |
          # generatedUtc always changes on regen, so compare content with it stripped.
          committed=$(git show HEAD:PostInstall/Verify/verification-manifest.json | jq 'del(.generatedUtc)')
          regenerated=$(jq 'del(.generatedUtc)' PostInstall/Verify/verification-manifest.json)
          if [ "$committed" != "$regenerated" ]; then
            echo "::error::verification-manifest.json is stale. Run tools/generate_verification_manifest.py and commit the result."
            diff <(echo "$committed") <(echo "$regenerated") || true
            exit 1
          fi

      - name: Package .apbx
        run: |
          # AME Wizard expects playbook.conf at archive root — package contents,
          # not the folder. Images/ carries the OOBE software tile icons and AME
          # throws while building that list if they are missing, so it ships too.
          # Password 'malte' is the AME convention, not a secret; -mhe=on also
          # encrypts the file list, matching AGENTS.md's local packaging command.
          # Explicit list: repo docs, tools/ and CI files never ship.
          7z a -p'malte' -mhe=on -mx=9 Chamber.7z \
            playbook.conf playbook.png Configuration Executables Images PostInstall
          mv Chamber.7z Chamber.apbx

      # AME reads playbook.conf from the archive root. If packaging ever picks up
      # the containing folder instead of its contents, every path shifts by one
      # and AME rejects the playbook with a message that does not say why. The
      # named files are the ones whose absence fails at ISO-injection or first
      # boot rather than at load, which is far too late to find out.
      - name: Verify .apbx structure
        run: |
          7z l -p'malte' Chamber.apbx > /tmp/apbx-listing.txt
          cat /tmp/apbx-listing.txt
          missing=0
          for required in \
              playbook.conf \
              Configuration/main.yml \
              Configuration/Tasks/0-iso-cache.yml \
              Configuration/Tasks/10-finalize.yml \
              Executables/Install-CachedBrowser.ps1 \
              Executables/Complete-ChamberSetup.ps1 \
              Executables/Write-ChamberReceipt.ps1 \
              Executables/Disable-BitLockerEncryption.ps1 \
              Images/chrome.png \
              Images/brave.png \
              PostInstall/Welcome.html \
              PostInstall/Verify/Verify-Chamber.ps1; do
            if ! grep -qF "$required" /tmp/apbx-listing.txt; then
              echo "::error::$required is missing from Chamber.apbx"
              missing=1
            fi
          done
          exit $missing

      - name: Generate checksums
        run: |
          sha256sum Chamber.apbx > SHA256SUMS.txt
          # Hash every executable script so users can verify against the repo
          find Executables PostInstall -type f \( -name '*.ps1' -o -name '*.bat' \) -print0 \
            | sort -z | xargs -0 sha256sum >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Chamber.apbx
            SHA256SUMS.txt
          generate_release_notes: true

      - name: Upload artifact (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Chamber-apbx
          path: |
            Chamber.apbx
            SHA256SUMS.txt
