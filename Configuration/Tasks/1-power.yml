title: Power Plan
actions:
  - !status: {status: 'Step 1 of 8: Setting up the Chamber power plan'}

  # One script so the plan can follow the hardware: Ultimate Performance on
  # desktops, Balanced-based on dual-CCD Ryzen X3D (AMD's V-Cache driver needs
  # Balanced's core parking to steer games to the cache CCD) and on laptops
  # (performance values on AC only, battery left at Windows' own). It also sets
  # USB selective suspend and PCIe ASPM off through powercfg, plus the idle
  # timeouts and hibernation. See the script header for the full table.
  #
  # The stock Balanced / High Performance / Power Saver schemes are deliberately
  # left in place. They are inactive and cost nothing, and keeping them means a
  # user can fall back or A/B against Balanced without powercfg -restoredefaultschemes.
  #
  # errorAction: Log - if no base scheme can be duplicated the script changes
  # nothing and exits 1; a stock power plan is not a reason to stop provisioning.
  - !cmd:
      exeDir: true
      runas: currentUserElevated
      command: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\Set-ChamberPowerPlan.ps1"'
      wait: true
      errorAction: Log

  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling'
      value: 'PowerThrottlingOff'
      type: REG_DWORD
      data: '1'

  # Retired in 1.3.0. Kept as deletes so an in-place upgrade from an earlier
  # Chamber cleans up after itself. Services\USB\DisableSelectiveSuspend is not
  # read by current Windows; USB selective suspend is now set in the power
  # scheme by Set-ChamberPowerPlan.ps1.
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Services\USB'
      value: 'DisableSelectiveSuspend'
      operation: delete
