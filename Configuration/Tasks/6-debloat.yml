title: Debloat
actions:
  - !status: {status: 'Step 5 of 8: Removing preinstalled clutter apps'}

  - !cmd:
      exeDir: true
      runas: currentUserElevated
      command: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\Invoke-BalancedDebloat.ps1"'
      wait: true
      errorAction: Log

  # OneDrive installs itself per user, at each account's first sign-in, from this
  # Run value in the Default profile. During an injected OOBE no user exists yet
  # and the script above runs as SYSTEM, so there is nothing for it to uninstall;
  # deleting the value here is what keeps OneDrive off the accounts created later.
  # AME applies HKCU actions to the Default profile as well as existing users.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run'
      value: 'OneDriveSetup'
      operation: delete

  # Windows Update's orchestrator reinstalls Outlook and Dev Home after they are
  # removed: UScheduler_Oobe holds the pending install, and workCompleted=1
  # marks the scheduled job as already done. Same approach as AtlasOS. Both
  # apps can still be installed from the Microsoft Store.
  - !registryKey:
      path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\OutlookUpdate'
      operation: delete

  - !registryKey:
      path: 'HKLM\SOFTWARE\Microsoft\WindowsUpdate\Orchestrator\UScheduler_Oobe\DevHomeUpdate'
      operation: delete

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Orchestrator\UScheduler\OutlookUpdate'
      value: 'workCompleted'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Orchestrator\UScheduler\DevHomeUpdate'
      value: 'workCompleted'
      type: REG_DWORD
      data: '1'

  - !status: {status: 'Step 5 of 8: Removing Xbox apps', option: 'remove-xbox'}

  - !cmd:
      exeDir: true
      runas: currentUserElevated
      command: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\Invoke-BalancedDebloat.ps1" -XboxOnly'
      wait: true
      option: 'remove-xbox'
      errorAction: Log
