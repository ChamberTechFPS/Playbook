  - !status: {status: 'Step 2 of 8: Turning off services a gaming PC does not need'}

  - !service:
      name: 'MapsBroker'
      operation: change
      startup: 4

  - !service:
      name: 'PcaSvc'
      operation: change
      startup: 4

  - !service:
