      operation: change
      startup: 4

  - !service:
      name: 'dmwappushservice'
      operation: change
      startup: 4

  - !service:
      name: 'wisvc'
      operation: change
      startup: 4

  - !status: {status: 'Step 2 of 8: Turning off background network services'}

  - !service:
      name: 'WMPNetworkSvc'
      operation: change
