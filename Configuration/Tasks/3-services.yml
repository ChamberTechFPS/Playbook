  - !service:
      name: 'GamingServices'
      operation: change
      startup: 4
      option: 'remove-xbox'

  - !status: {status: 'Step 2 of 8: Keeping search and typing services on'}

  # Retired in 1.4.0: these four were disabled by earlier Chamber versions.
  # They are written back to their Windows defaults so an in-place upgrade
  # turns them on again; on a fresh install this changes nothing.
  #   WSearch            Start and File Explorer search, Outlook search. It now
  #                      pauses during Game Mode instead (RespectPowerModes,
  #                      phase 5), which is what keeps it out of matches.
  #   SysMain            Preloads frequently used apps and games into spare RAM
  #                      and manages memory compression. Disabling it had no
  #                      measured gain and can lengthen load times.
  #   TabletInputService Emoji panel (Win+.), clipboard history (Win+V), the touch
  #                      keyboard and Chinese/Japanese/Korean input.
  #   TapiSrv            Telephony. Manual start, so it costs nothing until a
  #                      dial-up, PPPoE or built-in VPN connection asks for it.
  - !service:
      name: 'WSearch'
      operation: change
      startup: 2

  # Windows ships WSearch as Automatic (Delayed Start).
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Services\WSearch'
      value: 'DelayedAutoStart'
      type: REG_DWORD
      data: '1'

  - !service:
      name: 'SysMain'
      operation: change
      startup: 2

  - !service:
      name: 'TabletInputService'
      operation: change
      startup: 3

  - !service:
      name: 'TapiSrv'
      operation: change
      startup: 3

  - !status: {status: 'Step 2 of 8: Turning off telemetry scheduled tasks'}

  # These wake on timers or idle triggers and do seconds-long bursts of CPU and
  # disk work - application inventory scans, CEIP uploads, disk diagnostics. When
  # one fires mid-match it lands in the 1% and 0.1% lows, not the average. All are
  # telemetry or compatibility-data collectors; none is servicing or security. A
  # task missing on a given build is skipped by AME (ProgramDataUpdater, for one,
  # was removed in 24H2).
  - !scheduledTask:
      path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Application Experience\ProgramDataUpdater'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Application Experience\PcaPatchDbTask'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Application Experience\MareBackup'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Feedback\Siuf\DmClient'
      operation: disable

  - !scheduledTask:
      path: '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload'
      operation: disable
