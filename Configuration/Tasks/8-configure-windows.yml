title: Configure Windows
actions:
  - !status: {status: 'Step 7 of 8: Cleaning up the taskbar'}

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarAl'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'ShowTaskViewButton'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Search'
      value: 'SearchboxTaskbarMode'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarDa'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'TaskbarMn'
      type: REG_DWORD
      data: '0'

  - !status: {status: 'Step 7 of 8: Applying OLED burn-in protection', option: 'oled-safety'}

  - !cmd:
      command: 'powercfg -change -monitor-timeout-ac 5'
      wait: true
      errorAction: Log
      option: 'oled-safety'

  - !cmd:
      command: 'powercfg -change -monitor-timeout-dc 5'
      wait: true
      errorAction: Log
      option: 'oled-safety'

  # Taskbar auto-hide needs Explorer's taskbar window, which does not exist
  # during an injected OOBE - the script exits 1 there. oobe: false, and
  # Complete-ChamberSetup.ps1 -Mode User runs it at each user's first sign-in.
  - !cmd:
      exeDir: true
      runas: currentUserElevated
      command: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\Enable-OledSafety.ps1"'
      wait: true
      errorAction: Log
      option: 'oled-safety'
      oobe: false

  - !status: {status: 'Step 7 of 8: Setting up File Explorer'}

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'HideFileExt'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Hidden'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'LaunchTo'
      type: REG_DWORD
      data: '1'

  - !status: {status: 'Step 7 of 8: Restoring the classic right-click menu'}

  # oobe: false - during an injected OOBE `currentUserElevated` is SYSTEM, so
  # this would write SYSTEM's HKCU. Complete-ChamberSetup.ps1 -Mode User sets
  # the same key at each user's first sign-in instead.
  - !cmd:
      runas: currentUserElevated
      command: 'reg.exe add "HKCU\Software\Classes\CLSID\{86ca1aa0-34aa-4e8b-a509-50c905bae2a2}\InprocServer32" /ve /f'
      wait: true
      errorAction: Log
      oobe: false

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization'
      value: 'NoLockScreen'
      type: REG_DWORD
      data: '1'

  - !status: {status: 'Step 7 of 8: Turning off accessibility shortcut pop-ups'}

  - !registryValue:
      path: 'HKCU\Control Panel\Accessibility\StickyKeys'
      value: 'Flags'
      type: REG_SZ
      data: '506'

  - !registryValue:
      path: 'HKCU\Control Panel\Accessibility\ToggleKeys'
      value: 'Flags'
      type: REG_SZ
      data: '58'

  - !registryValue:
      path: 'HKCU\Control Panel\Accessibility\Keyboard Response'
      value: 'Flags'
      type: REG_SZ
      data: '122'

  - !status: {status: 'Step 7 of 8: Turning on dark mode'}

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'AppsUseLightTheme'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'SystemUsesLightTheme'
      type: REG_DWORD
      data: '0'

  # Transparency (the acrylic/Mica blur behind menus, the taskbar, and Settings)
  # is DWM compositor work on every redraw of those surfaces. Off by default: it
  # costs frames for a purely cosmetic effect, and it is the one Personalize
  # value VisualFXSetting in phase 4 does not cover. Users who want it back can
  # flip it in Settings > Personalization > Colors > Transparency effects.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
      value: 'EnableTransparency'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'SnapAssist'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'ShowCopilotButton'
      type: REG_DWORD
      data: '0'

  - !status: {status: 'Step 7 of 8: Gaming quality-of-life settings'}

  # Sound > Communications: "Do nothing". Windows' default turns every other
  # sound down 80% while a Discord or Teams call is open - including the game.
  - !registryValue:
      path: 'HKCU\SOFTWARE\Microsoft\Multimedia\Audio'
      value: 'UserDuckingPreference'
      type: REG_DWORD
      data: '3'

  # "End task" on the taskbar's right-click menu: close a frozen game without
  # opening Task Manager over it.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings'
      value: 'TaskbarEndTask'
      type: REG_DWORD
      data: '1'

  # Dynamic Lighting takes control of RGB devices and fights the vendor apps
  # (iCUE, Armoury Crate, SignalRGB) most gaming PCs already use. Anyone who
  # wants Windows to drive their RGB turns it back on in Settings >
  # Personalization > Dynamic Lighting.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Lighting'
      value: 'AmbientLightingEnabled'
      type: REG_DWORD
      data: '0'
