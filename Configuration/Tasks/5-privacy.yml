title: Privacy
actions:
  - !status: {status: 'Step 4 of 8: Reducing Windows telemetry'}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'AllowTelemetry'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection'
      value: 'AllowTelemetry'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\WMI\Autologger\Diagtrack-Listener'
      value: 'Start'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\WMI\Autologger\SQMLogger'
      value: 'Start'
      type: REG_DWORD
      data: '0'

  # Setup and upgrade telemetry trace, started at every boot.
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\WMI\Autologger\SetupPlatformTel'
      value: 'Start'
      type: REG_DWORD
      data: '0'

  # The rest of the DataCollection policy set (as ReviOS applies it): no
  # feedback pop-ups, no diagnostic log or crash dump uploads, and the PC's name
  # left out of whatever diagnostic data Windows still sends.
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'DoNotShowFeedbackNotifications'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'LimitDiagnosticLogCollection'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'LimitDumpCollection'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DataCollection'
      value: 'AllowDeviceNameInTelemetry'
      type: REG_DWORD
      data: '0'

  # "Windows should ask for my feedback": Never.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Siuf\Rules'
      value: 'NumberOfSIUFInPeriod'
      type: REG_DWORD
      data: '0'

  # .NET SDK and PowerShell 7 send usage telemetry on every run unless these are
  # set. Machine environment variables, so they apply to every user and take
  # effect for processes started after the restart.
  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
      value: 'DOTNET_CLI_TELEMETRY_OPTOUT'
      type: REG_SZ
      data: '1'

  - !registryValue:
      path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment'
      value: 'POWERSHELL_TELEMETRY_OPTOUT'
      type: REG_SZ
      data: '1'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\AdvertisingInfo'
      value: 'Enabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_TrackProgs'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
      value: 'EnableActivityFeed'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\System'
      value: 'PublishUserActivities'
      type: REG_DWORD
      data: '0'

  - !status: {status: 'Step 4 of 8: Turning off Copilot'}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsCopilot'
      value: 'TurnOffWindowsCopilot'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKCU\Software\Policies\Microsoft\Windows\WindowsCopilot'
      value: 'TurnOffWindowsCopilot'
      type: REG_DWORD
      data: '1'

  # 24H2, 25H2 and 26H2 share one servicing branch; 26H2 is an enablement
  # package that switches on features already shipped in monthly updates. The
  # values below cover those newer surfaces. Recall and Click to Do exist only
  # on Copilot+ PCs; on other hardware the policies are inert.
  - !status: {status: 'Step 4 of 8: Turning off Recall and Click to Do'}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'DisableAIDataAnalysis'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsAI'
      value: 'DisableClickToDo'
      type: REG_DWORD
      data: '1'

  - !status: {status: 'Step 4 of 8: Removing web results from search'}

  # Removes Bing web results from Start search. Side effect: File Explorer's
  # search box also stops listing recent searches.
  - !registryValue:
      path: 'HKCU\Software\Policies\Microsoft\Windows\Explorer'
      value: 'DisableSearchBoxSuggestions'
      type: REG_DWORD
      data: '1'

  # Policy backup for the value above: Windows updates have re-enabled web
  # results in Start before while leaving DisableSearchBoxSuggestions in place.
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search'
      value: 'ConnectedSearchUseWeb'
      type: REG_DWORD
      data: '0'

  # Search highlights: the illustrated "trivia" in the search box and Start,
  # downloaded from Microsoft every day.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings'
      value: 'IsDynamicSearchBoxEnabled'
      type: REG_DWORD
      data: '0'

  # Search indexing stays on (phase 3) so Start and Explorer search work, but
  # it pauses while Game Mode is active, CPU use is above 80% or disk use is
  # above 70%. That is what keeps it out of a match.
  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows Search\Gather\Windows\SystemIndex'
      value: 'RespectPowerModes'
      type: REG_DWORD
      data: '1'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_IrisRecommendations'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
      value: 'Start_AccountNotifications'
      type: REG_DWORD
      data: '0'

  - !status: {status: 'Step 4 of 8: Turning off tips, ads and suggested apps'}

  # Suggested apps in Start, and silent installs of promoted apps.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SystemPaneSuggestionsEnabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338388Enabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SilentInstalledAppsEnabled'
      type: REG_DWORD
      data: '0'

  # Tips and "get even more out of Windows" prompts.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SoftLandingEnabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338389Enabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-310093Enabled'
      type: REG_DWORD
      data: '0'

  # Suggested content in the Settings app.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338393Enabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-353694Enabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-353696Enabled'
      type: REG_DWORD
      data: '0'

  # Fun facts and tips over the lock screen picture.
  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'RotatingLockScreenOverlayEnabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager'
      value: 'SubscribedContent-338387Enabled'
      type: REG_DWORD
      data: '0'

  - !status: {status: 'Step 4 of 8: Blocking telemetry programs'}

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe'
      value: 'Debugger'
      type: REG_SZ
      data: '%windir%\System32\taskkill.exe'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\AggregatorHost.exe'
      value: 'Debugger'
      type: REG_SZ
      data: '%windir%\System32\taskkill.exe'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\DeviceCensus.exe'
      value: 'Debugger'
      type: REG_SZ
      data: '%windir%\System32\taskkill.exe'

  # Retired in 1.4.0: hosts-file telemetry blocks. Chamber leaves Defender on,
  # and Defender flags these entries as SettingsModifier:Win32/HostsFileHijack
  # and can strip them, so the block raised a threat alert and was not reliable.
  # The services, policies and IFEO blocks above already stop the telemetry.
  # The script removes only the six lines older Chamber versions added.
  - !cmd:
      exeDir: true
      command: 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\Remove-HostsTelemetryBlocks.ps1"'
      wait: true
      errorAction: Log

  # Intentionally do not add Windows Firewall "domain block" rules here.
  # The older netsh version used remoteip=any, which can break all outbound traffic.
  # No status line for the skip: a progress screen saying "internet breakage"
  # about something Chamber is deliberately not doing only alarms people.

  - !status: {status: 'Step 4 of 8: Stopping background apps and update sharing'}

  # Delivery Optimization defaults to peer-to-peer: the PC uploads Windows and
  # Store update data to other PCs, at any time, including mid-match. 0 = HTTP
  # only - updates still download from Microsoft, nothing is seeded to peers.
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization'
      value: 'DODownloadMode'
      type: REG_DWORD
      data: '0'

  # Force Deny for Store (UWP) apps running in the background. Win32 games,
  # launchers and Discord are not Store apps and are unaffected; a Store app
  # still runs normally while it is open. Side effect: Store apps such as Mail
  # or Phone Link stop syncing and notifying while closed.
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\AppPrivacy'
      value: 'LetAppsRunInBackground'
      type: REG_DWORD
      data: '2'

  # Edge keeps processes resident after its last window closes (background
  # mode) and pre-launches them at sign-in (Startup Boost) - both whether or not
  # Edge is the browser in use. Side effect: as with any Edge policy, edge://
  # settings shows "Your browser is managed by your organization".
  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
      value: 'StartupBoostEnabled'
      type: REG_DWORD
      data: '0'

  - !registryValue:
      path: 'HKLM\SOFTWARE\Policies\Microsoft\Edge'
      value: 'BackgroundModeEnabled'
      type: REG_DWORD
      data: '0'
