<?xml version="1.0" encoding="utf-8"?>
<Playbook>
    <Name>Chamber</Name>
    <Username>Chamber</Username>
    <UniqueId>d3f8a1b2-7c4e-4f9d-b6a5-2e1c8d0f3a7b</UniqueId>
    <ShortDescription>Maximum performance gaming setup for competitive esports PCs</ShortDescription>
    <Title>Chamber Gaming Setup</Title>
    <Description>A professional gaming PC configuration toolkit. Applies performance optimizations, removes bloatware, configures privacy settings, and prepares systems for competitive esports titles including Fortnite, Valorant, CS2, and Call of Duty. Requires 64-bit (x64) Windows 11; ARM64 is not supported.</Description>
    <Details>Chamber v1.3.3 - Gaming PC setup by ChamberTech</Details>
    <Version>1.3.3</Version>

    <!-- Shown on AME's progress screen while the playbook runs, including during
         an injected OOBE. Without it AME falls back to its own generic wording. -->
    <!-- Must match what the user actually sees next: the progress text counts
         Step 1 to Step 8 (main.yml), and Install-PostInstallCompanion.ps1 opens
         the welcome page at the first sign-in. -->
    <ProgressText>Chamber is setting up Windows for gaming in 8 steps. This takes a few minutes. When you reach the desktop, a page opens with the drivers your PC still needs.</ProgressText>
    <EstimatedMinutes>5</EstimatedMinutes>

    <!-- `any` lets AME upgrade in place from any earlier Chamber version rather
         than demanding a fresh install. ReviOS uses the same value. -->
    <UpgradableFrom>any</UpgradableFrom>
    <SupportedBuilds>
        <!-- Windows 11 24H2 / 25H2 / 26H2 only. 22H2/23H2 were dropped in 1.2.6;
             Windows 10 is not supported. -->
        <!-- 24H2 / 25H2 -->
        <string>26100</string>
        <string>26200</string>
        <!-- 26H2. Declared ahead of validation so the playbook is not blocked on
             day one - every tweak here is build-agnostic registry, service and BCD
             work with no 26H2-specific API. Treat it as unverified until a fresh
             26300 install has been run and checked with Verify-Chamber.ps1. -->
        <string>26300</string>
    </SupportedBuilds>
    <Requirements>
        <Requirement>NoPendingUpdates</Requirement>
        <Requirement>NoAntivirus</Requirement>
    </Requirements>

    <!-- Enables AME's update check and the "source code" link on the playbook
         page. No DonateLink by choice. Website is omitted because AME only
         surfaces it for verified playbooks. -->
    <Git>https://github.com/ChamberTechFPS/Playbook/</Git>

    <!-- ISO injection support.

         With SupportsISO set, AME Wizard can bake Chamber into a Windows ISO so
         the playbook applies during a custom OOBE at first boot instead of being
         run manually afterwards.

         Two stages, and the split matters. Injection runs offline against the
         mounted image on the machine building the ISO; the OOBE runs later
         against a live Windows install at first boot. Only Tasks/0-iso-cache.yml
         belongs to the injection stage - it is nothing but !download actions
         pulling the selected browser payload into the image. Every one of the
         ten numbered phases runs live, during the OOBE, in its current order.

         Before any action runs, AME copies the whole playbook folder into the
         image at ProgramData\AME\OOBE\Playbook and installs its own OOBE
         (msoobe.exe is renamed msoobeext.exe and replaced by AME's shim, which
         hands off to ProgramData\AME\OOBE\OOBE.exe, also started by the
         `ameoobe` service). The first-boot run executes from that copy, which
         is why a !download at injection lands where Install-CachedBrowser.ps1
         looks for it.

         `iso:` is set on exactly two things and may not spread further:
         the `!task:` include for 0-iso-cache.yml in main.yml (`iso: only`) and
         the !download actions inside it (`iso: only`). Most actions default to
         `iso: false`; !task, !download and !software default to `iso: true`.
         AME calls IsISOCompatible() on every action whose `iso` is not false,
         on every run - and !cmd, !run, !powerShell, !taskKill, !appx and
         !systemPackage reject it outright ("For safety reasons, CmdAction does
         not support iso"); !service accepts it only for delete/change. Setting
         `iso: true` on one of them does not degrade gracefully: it throws during
         parsing and the whole playbook stops loading.

         The other `!task:` includes in main.yml are left unannotated on purpose.
         That action type defaults to iso and oobe both true, so AME walks into
         every phase file at injection time and again during the OOBE. The
         actions inside them are `iso: false`, so they are skipped at injection
         and applied at OOBE - which is exactly what Chamber wants.

         `cpuArch:` and `builds:` are evaluated against the ISO being built at
         injection time, and against the running system otherwise.

         Do not move phases to injection time to shorten the OOBE. Phases 4, 5
         and 9 are not pure !registryValue - each also shells out (fsutil in 4,
         the hosts-file script in 5, netsh in 9), so marking any of them
         `iso: true` would hard-fail the parse described above. PRD FR-029: an
         offline migration needs its own issue, proof and rollback plan. -->
    <SupportsISO>true</SupportsISO>

    <OOBE>
        <BulletPoints>
            <!-- Copy is fixed by the PRD (section 6.3) and ordered Lock, Privacy,
                 Rocket. Title and Description lengths must roughly match AME's
                 examples (titles ~8-16 chars, descriptions ~90-110); these render
                 on the OOBE summary page and longer strings risk being clipped.

                 None of this may claim the PC is already optimized or verified -
                 both only become true after the run and after Chamber Verify. -->
            <BulletPoint Icon="Lock" Title="Anti-cheat ready"
            Description="Keeps Secure Boot enabled and avoids changes that conflict with modern competitive anti-cheat."/>
            <BulletPoint Icon="Privacy" Title="Balanced privacy"
            Description="Reduces telemetry and consumer clutter while keeping essential Windows tools available."/>
            <BulletPoint Icon="Rocket" Title="Competition tuned"
            Description="Applies the selected gaming profile, browser, and Chamber verification tools in one guided setup."/>
        </BulletPoints>
        <!-- Milestone 1 (compatibility) value. Phase 10 still reaches the network
             on any path the cached payload does not cover - winget for the
             traditional run, and the connectivity probe - so the OOBE gates on a
             connection rather than letting the install finish half-done.

             PRD FR-004: this becomes <Internet>Request</Internet> once the
             "Chrome cached and OOBE fully offline" and "Brave cached and OOBE
             fully offline" rows of the runtime matrix pass on 26100, 26200
             and 26300. Do not flip it on static evidence. -->
        <Internet>Force</Internet>
    </OOBE>

    <!-- Browser payloads cached into the image by Tasks/0-iso-cache.yml. At
         injection AME writes the entries whose Option was selected into the
         image's oobe.conf (name, title, description, icon, DefaultWebBrowser,
         Local), and the OOBE client displays them. The install itself is done
         by 10-finalize via Install-CachedBrowser.ps1.

         AME's docs (developers/iso.html) describe this list as informational -
         "so users can see which software will be installed in the OOBE" - and
         say Name "should ideally correspond to the `package` property" on a
         !software or !download action. The validator enforces that pairing.
         It does not drive installation: letting the OOBE user change software
         is listed there as future work. If that lands, deselecting a tile could
         only affect actions carrying `package:`; the install here is a !cmd,
         which has no such property, so revisit 10-finalize then.

         DefaultWebBrowser is set on both because the browser page is a radio
         group: exactly one of these options can be selected, so only one entry
         is ever live. Whether the current AME build honours the attribute is
         PRD open question 3 and is confirmed in VM testing, not here. -->
    <Software>
        <Package Option="browser-chrome" DefaultWebBrowser="true">
            <Name>chrome</Name>
            <Title>Google Chrome</Title>
            <Description>Installed for you during setup. Already on the USB, so no download needed.</Description>
            <Icon>chrome.png</Icon>
        </Package>
        <Package Option="browser-brave" DefaultWebBrowser="true">
            <Name>brave</Name>
            <Title>Brave</Title>
            <Description>Installed for you during setup. Already on the USB, so no download needed.</Description>
            <Icon>brave.png</Icon>
        </Package>
    </Software>

    <ISO>
        <!-- Windows 11 24H2+ turns on automatic device encryption during setup,
             before any playbook action gets to run. On a Chamber ISO that is not
             wanted: the TPM seals the key against firmware measurements, so a
             BIOS update, a Secure Boot toggle, a CMOS reset or a TPM clear can
             drop the machine at a 48-digit recovery-key prompt it cannot get
             past. On a gaming build that is a brick for anyone who does not know
             the key is sitting in a Microsoft account.

             No anti-cheat requires an encrypted drive. Vanguard, EAC and
             BattlEye require Secure Boot and TPM 2.0 - both stay on, and both
             are checked by Verify-Chamber. BitLocker uses the TPM but is a
             separate feature, and nothing about it is measured by anti-cheat.

             This is unconditional and cannot be gated on a feature option: AME
             reads it while building the image, long before there is a system to
             run actions against. Every PC installed from a Chamber ISO therefore
             starts unencrypted. That is a deliberate trade - a drive that is
             readable if the machine is stolen, in exchange for one that always
             boots. Encryption can be turned on afterwards from Settings, and
             then it is the owner's decision with the owner's recovery key.

             What AME actually does with it: writes sources\$OEM$\$$\Panther\
             unattend.xml into the ISO with PreventDeviceEncryption and
             TCGSecurityActivationDisabled in the oobeSystem pass. The same file
             also sets BypassNRO=1 in the specialize pass - AME couples the two,
             so Windows' own "network required" OOBE block is lifted as a side
             effect. It does not override <Internet>Force</Internet>, which AME's
             OOBE enforces separately.

             This deviates from PRD FR-005, at the project owner's direction. -->
        <DisableBitLocker>true</DisableBitLocker>

        <!-- DisableHardwareRequirements is deliberately NOT set. Chamber targets
             competitive titles whose anti-cheat requires Secure Boot and TPM 2.0.
             Riot Vanguard refuses to start without them, and Verify-Chamber warns
             about exactly that. Bypassing setup's hardware check would produce a
             machine that cannot run the games this playbook exists for. -->
    </ISO>

    <FeaturePages>
        <!-- PAGE 1: Browser Choice (3 max) -->
        <!-- IsRequired + DefaultOption are mandatory here for ISO injection. RadioOption
             has no IsChecked property (only CheckboxOption does), so a RadioPage with
             neither attribute has no selection at all. In the GUI the user clicks one;
             during injection there is nobody to click, so AME dereferences a null while
             baking the selections in and dies with a NullReferenceException in
             IsoProgressDialog.Begin. Atlas and ReviOS both set these on every radio page. -->
        <RadioPage IsRequired="true" DefaultOption="browser-chrome" Description="Pick your browser. Chamber installs it for you during setup.">
            <Options>
                <RadioOption>
                    <Text>Google Chrome</Text>
                    <Name>browser-chrome</Name>
                </RadioOption>
                <RadioOption>
                    <Text>Brave (built-in ad blocking)</Text>
                    <Name>browser-brave</Name>
                </RadioOption>
                <RadioOption>
                    <Text>None - keep Microsoft Edge</Text>
                    <Name>browser-skip</Name>
                </RadioOption>
            </Options>
        </RadioPage>

        <!-- PAGE 2: Gaming Services (TopLine — 3 max) -->
        <CheckboxPage Description="Xbox apps and Game Bar. Game Mode stays on either way.">
            <TopLine Text="Gaming Services"/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Remove Xbox apps and services</Text>
                    <Name>remove-xbox</Name>
                    <Description>Removes the Xbox app, Game Bar and Xbox sign-in, and disables Xbox services, including the one Xbox controllers use for updates. Breaks Game Pass and Xbox sign-in in games.</Description>
                </CheckboxOption>
                <CheckboxOption IsChecked="true">
                    <Text>Turn off Game Bar overlay and recording</Text>
                    <Name>disable-gamebar</Name>
                    <Description>Turns off the Game Bar overlay (Win+G) and background game recording. Use your GPU's own recorder instead. Game Mode is not affected.</Description>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- PAGE 3: Display Protection (1) -->
        <CheckboxPage Description="Only tick this if you game on an OLED monitor.">
            <TopLine Text="Display"/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>OLED burn-in protection</Text>
                    <Name>oled-safety</Name>
                    <Description>Turns the display off after 5 idle minutes and auto-hides the taskbar, so static screen elements don't burn in.</Description>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- PAGE 4: Drive Encryption (1, TopLine - max 3) -->
        <!-- An ISO install is always unencrypted (<DisableBitLocker> in <ISO>),
             so on the injection path this box changes nothing. The description
             says so, because a viewer following the ISO tutorial would
             otherwise wonder whether to tick it. -->
        <!-- Its own page rather than a fifth option on the security page, which
             is already at AME's four-option limit. It also earns the room: this
             is the one Chamber option that changes whether the data on the drive
             is readable, and the description needs space to say so. -->
        <CheckboxPage Description="USB installs already skip encryption. This is for an existing PC.">
            <TopLine Text="Drive Encryption"/>
            <Options>
                <CheckboxOption IsChecked="false">
                    <Text>Turn off BitLocker / device encryption</Text>
                    <Name>disable-bitlocker</Name>
                    <Description>Stops Windows encrypting the system drive and decrypts it if it already started. No more recovery-key prompt after a BIOS update or TPM reset. The drive is readable if the PC is stolen.</Description>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

        <!-- PAGE 5: Security Options (no TopLine — 4 allowed) -->
        <!-- Last on purpose: a first-time viewer should not open the wizard on
             "turn off Defender". validate_playbook_conf.py keeps it last. -->
        <!-- PRD FR-014: the ISO creator has to know these are one-way. AME shows
             the same pages for a normal run and for injection, and there is no
             wording hook for "injection only", so the note is phrased to be true
             in both cases. -->
        <CheckboxPage Description="Advanced. Leave all unticked if unsure. On a USB, they apply to every PC.">
            <Options>
                <!-- "Turn off Microsoft Defender" (remove-defender) was removed in
                     1.3.0: Tamper Protection is on after every fresh install and
                     makes Windows ignore the policy, so on an ISO install the
                     option silently did nothing. Defender stays on. -->
                <CheckboxOption IsChecked="false">
                    <Text>Turn off VBS and Memory Integrity</Text>
                    <Name>disable-vbs</Name>
                    <Description>Can raise FPS in some CPU-bound games; the gain depends on your hardware. Breaks WSL2, Windows Sandbox and Docker Desktop. Some anti-cheat, such as Riot Vanguard, can require it.</Description>
                </CheckboxOption>
                <CheckboxOption IsChecked="false">
                    <Text>Stop automatic Windows Updates</Text>
                    <Name>disable-updates</Name>
                    <Description>Windows tells you about updates instead of installing them. You install them yourself from Settings. Store and Xbox downloads still work. You will miss security fixes until you do.</Description>
                </CheckboxOption>
                <!-- Off by default. PRD FR-010: every security-reducing option
                     ships unchecked so an ISO creator opts in deliberately -
                     these choices are baked into every PC installed from the
                     resulting image and cannot be revisited at first boot. -->
                <CheckboxOption IsChecked="false">
                    <Text>Turn off Smart App Control</Text>
                    <Name>disable-sac</Name>
                    <Description>Smart App Control blocks unsigned apps, which can include game installers, mod tools and overclocking utilities.</Description>
                </CheckboxOption>
            </Options>
        </CheckboxPage>

    </FeaturePages>
</Playbook>
